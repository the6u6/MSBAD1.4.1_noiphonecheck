name: Build MacStatusBar&Dock

"on":
  # `on:` must stay quoted: PyYAML and other YAML 1.1 parsers turn a bare `on` key into the
  # boolean True. GitHub's own parser handles it, but quoting keeps third-party tooling sane.
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write   # required to create the GitHub Release below

jobs:
  build:
    # macOS runners ship Apple's dwarfdump / nm / otool, which tools/make-crashmap.py needs.
    # GNU binutils' nm cannot read Mach-O, so a Linux/Windows runner would need shims instead.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # The iPad-only gate is deleted outright in this fork, so its absence is the check: if
      # MSBDIsIPad or common/DeviceGate.h ever reappear, the build would silently become
      # iPad-only again, which is the exact failure this workflow exists to prevent.
      - name: Verify the device gate is gone
        run: |
          if [ -e common/DeviceGate.h ]; then
            echo "::error::common/DeviceGate.h exists - this fork deletes the device gate"
            exit 1
          fi
          if grep -rn 'MSBDIsIPad\|noIPad\|--is-ipad' loader macsettings layout tools 2>/dev/null; then
            echo "::error::a device-gate call site is back in the tree"
            exit 1
          fi
          echo "device gate absent (DeviceGate.h deleted, no call sites)"

      - name: Install build tools (GNU Make 4.x, ldid)
        run: |
          # macOS ships make 3.81 as `make`, and Theos's bundle step hangs on it under -jN.
          # The runner images do not guarantee `gmake`, so take it from Homebrew.
          if brew list --versions make >/dev/null 2>&1; then
            echo "using Homebrew make $(brew list --versions make | cut -d' ' -f2)"
          else
            brew install make
          fi
          gmake --version | head -1

          # Theos does NOT ship ldid: upstream theos/bin/ contains no ldid (it is a 404), because
          # Theos assumes it is already on PATH -- true on a developer Mac that installed it
          # separately, false on a bare CI runner. Without it every dylib fails at the "Signing"
          # step with "ldid: command not found" and Error 127. Homebrew has a native arm64 bottle.
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already present: $(ldid 2>&1 | head -1)"
          else
            brew install ldid
          fi
          command -v ldid
          ldid 2>&1 | head -2 || true

      # Installed under $RUNNER_TEMP, NOT /opt: /opt is root-owned on the runner image and a
      # plain `git clone` into it fails with "could not create work tree dir ... Permission
      # denied" (the earlier `sudo rm -rf` succeeding makes this look like a clone problem
      # rather than a permissions one).
      - name: Install Theos
        run: |
          THEOS_DIR="$RUNNER_TEMP/theos"
          rm -rf "$THEOS_DIR"
          git clone --depth 1 --recursive https://github.com/theos/theos "$THEOS_DIR"
          echo "THEOS=$THEOS_DIR"                >> "$GITHUB_ENV"
          echo "THEOS_NO_PYTHON_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "PATH=$THEOS_DIR/bin:$PATH"       >> "$GITHUB_ENV"

      # Only the one SDK this project targets (iphone:clang:16.5), fetched sparsely so the
      # ~2 GB theos/sdks repo is not downloaded in full.
      #
      # The tree is wiped first: a leftover sdks/ from an interrupted or re-run job (or one
      # left by Theos's own bootstrap) makes `git clone` refuse with "destination path already
      # exists and is not an empty directory", and a half-written .git there sends git into
      # errors that look nothing like the real cause. `git clone` on an existing directory is
      # not idempotent, so a retry would otherwise fail for a different reason than the
      # attempt before it.
      - name: Fetch the iPhoneOS 16.5 SDK
        run: |
          SDK_DIR="$THEOS/sdks"
          if [ -n "$(ls -A "$SDK_DIR" 2>/dev/null)" ]; then
            echo "::warning::$SDK_DIR is not empty - clearing it before cloning"
            du -sh "$SDK_DIR" 2>/dev/null || true
            rm -rf "$SDK_DIR"
          else
            echo "$SDK_DIR is empty or absent"
          fi
          git clone --filter=blob:none --sparse https://github.com/theos/sdks "$SDK_DIR"
          git -C "$SDK_DIR" sparse-checkout set iPhoneOS16.5.sdk
          ls -d "$SDK_DIR/iPhoneOS16.5.sdk"
          du -sh "$SDK_DIR"

      # Check every external tool Theos shells out to, and fail here with a clear message
      # instead of part-way through the build with "command not found" and a confusing exit
      # code. ldid and gmake were both missing on a bare runner and cost a build each.
      - name: Report the toolchain
        run: |
          echo "THEOS    : $THEOS"
          echo "make     : $(gmake --version | head -1)"
          echo "clang    : $(clang --version | head -1)"
          echo "ldid     : $(command -v ldid)"
          echo "otool    : $(command -v otool)"
          echo "nm       : $(command -v nm)"
          echo "dwarfdump: $(xcrun -f dwarfdump)"
          df -h "$RUNNER_TEMP" | tail -1
          for t in gmake clang ldid otool nm python3 git; do
            command -v "$t" >/dev/null 2>&1 || { echo "::error::$t is missing from PATH"; exit 1; }
          done
          xcrun -f dwarfdump >/dev/null 2>&1 || { echo "::error::dwarfdump is missing (needed by tools/make-crashmap.py)"; exit 1; }
          echo "all required tools present"

      # Debug package on purpose: tools/make-crashmap.py needs the unstripped .dSYM bundles that
      # FINALPACKAGE=1 strips away (it errors with "no matching symbols for ..." otherwise).
      - name: Build
        id: build
        run: gmake -j4 package V=1

      # tools/make-crashmap.py stops the build when a crashmap rule matches no function, which
      # can happen if a different clang renames a section header or function. That is a
      # packaging-precision failure, not a compile failure, so retry leniently before giving up.
      # Scoped to this step's own outcome: a failed Theos/SDK install must not be retried here,
      # or the real error gets buried under a confusing second failure.
      - name: Retry leniently if the crashmap step rejected the build
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::The build failed. Retrying with CRASHMAP_LENIENT=1."
          echo "(CrashMap.txt falls back to whole-part granularity: the crash guard still"
          echo "switches the right feature off, but blames a whole part, not one function.)"
          CRASHMAP_LENIENT=1 gmake -j4 package V=1

      - name: Locate the package
        id: pkg
        run: |
          find packages -name '*.deb' -exec ls -la {} \;
          deb=$(find packages -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb in packages/"; exit 1; }
          version=$(sed -n 's/^Version: //p' control | tr -d '[:space:]')
          echo "deb=$deb"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building version  : $version"

      - uses: actions/upload-artifact@v4
        with:
          name: MacStatusBarAndDock
          path: packages/*.deb
          if-no-files-found: error

      # Publish a GitHub Release so the .deb is downloadable straight from the Releases tab,
      # which is where package managers and users expect to find it (the artifact from the step
      # above expires after 90 days; a release does not).
      #
      # The tag is the version from control plus a run number, NOT the bare version: this is a
      # locally patched fork, so it can be rebuilt many times at the same 1.4.1, and a release
      # tag can only be created once per name. gh-release handles the collision by tagging a new
      # name each run.
      #
      # Two guards, because a failed release must not silently look like a failed build:
      #   * draft: true below means nothing is published unless the release step itself succeeds;
      #   * never_draft is unset, so the draft stays a draft for you to review and publish.
      - name: 1.4.1 debug with the check removed
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: packages/*.deb
          tag_name: local-${{ steps.pkg.outputs.version }}-run${{ github.run_number }}
          name: ${{ steps.pkg.outputs.version }} (run ${{ github.run_number }}, iPhone gate removed)
          body: |
            MacStatusBar&Dock ${{ steps.pkg.outputs.version }} — locally patched by the "Space Bunny Free" AI agent.

            **Difference from upstream:** the iPad-only device gate has been deleted outright —
            `common/DeviceGate.h` and its four call sites (in `loader/Loader.c`,
            `macsettings/sshtoggled/main.m` and `layout/DEBIAN/postinst`) — so the tweak loads on
            an iPhone instead of disabling itself. That is the only source change.

            **This is not an official release.** It is built from a fork and is not covered by
            upstream's testing. Built on GitHub Actions, `macos-14`, debug build (unstripped, so
            the per-function crash map is present).

            ### Install

            ```sh
            sudo dpkg -i MacStatusBar&Dock_${{ steps.pkg.outputs.version }}_iphoneos-arm64.deb
            ```

            Requires a rootless jailbreak plus ElleKit/libhooker/Substrate, Choicy or iCleaner Pro,
            and AltList. See the project's `control` file.

            ### Before you install

            This is an iPad tweak. Without a window engine (Aerial / Zetsu / MilkyWay4) the
            windowing features are inert, and the Dock, Finder and menu bar are laid out for a
            large display. It may well be unusable on an iPhone — the gate exists for reasons
            beyond policy.
