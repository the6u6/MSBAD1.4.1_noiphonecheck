name: Build MacStatusBar&Dock

# `on:` must stay unquoted: PyYAML and other YAML 1.1 parsers turn a bare `on` key into the
# boolean True. GitHub's own parser handles it, but quoting keeps third-party tooling sane.
"on":
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # macOS runners ship Apple's dwarfdump / nm / otool, which tools/make-crashmap.py needs.
    # GNU binutils' nm cannot read Mach-O, so a Linux/Windows runner would need shims instead.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # Fail fast and loudly if the device-gate patch is not actually in the tree, rather than
      # silently producing an iPad-only package.
      - name: Verify the device gate is patched out
        run: |
          grep -q '#define MSBD_ALLOW_ANY_DEVICE 1' common/DeviceGate.h \
            || { echo "::error::common/DeviceGate.h is not patched - MSBD_ALLOW_ANY_DEVICE is missing"; exit 1; }
          grep -n 'MSBD_ALLOW_ANY_DEVICE\|MSBDIsIPad' common/DeviceGate.h

      - name: Install Theos
        run: |
          sudo rm -rf /opt/theos
          git clone --depth 1 --recursive https://github.com/theos/theos /opt/theos
          sudo chown -R "$USER" /opt/theos
          echo "THEOS=/opt/theos"                       >> "$GITHUB_ENV"
          echo "THEOS_NO_PYTHON_VERSION_CHECK=1"        >> "$GITHUB_ENV"
          echo "PATH=/opt/theos/bin:$PATH"              >> "$GITHUB_ENV"

      # Only the one SDK this project targets (iphone:clang:16.5), fetched sparsely so the
      # ~2 GB theos/sdks repo is not downloaded in full.
      - name: Fetch the iPhoneOS 16.5 SDK
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks /opt/theos/sdks
          cd /opt/theos/sdks
          git sparse-checkout init --cone
          git sparse-checkout set iPhoneOS16.5.sdk
          git checkout
          ls -d /opt/theos/sdks/iPhoneOS16.5.sdk

      # Debug package on purpose: tools/make-crashmap.py needs the unstripped .dSYM bundles that
      # FINALPACKAGE=1 strips away (it errors with "no matching symbols for ..." otherwise).
      - name: Build
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          gmake -j4 package V=1
        continue-on-error: true

      # tools/make-crashmap.py stops the build when a crashmap rule matches no function, which
      # can happen if a different clang renames a section header or function. That is a
      # packaging-precision failure, not a compile failure, so retry leniently before giving up.
      - name: Retry leniently if the crashmap step rejected the build
        if: failure()
        run: |
          echo "First attempt failed. Retrying with CRASHMAP_LENIENT=1."
          echo "(CrashMap.txt will fall back to whole-part granularity.)"
          CRASHMAP_LENIENT=1 gmake -j4 package V=1

      - name: Locate the package
        run: find packages -name '*.deb' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: MacStatusBarAndDock
          path: packages/*.deb
          if-no-files-found: error
